<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" font-family="Inter, system-ui, sans-serif">
  <defs>
    <filter id="txtShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="0.6" result="thick"/>
      <feGaussianBlur in="thick" stdDeviation="2.2" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.95" result="flood"/>
      <feComposite in="flood" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style><![CDATA[
      .title { font-weight: 700; font-size: 30px; fill: #FFFFFF; letter-spacing: -0.5px; }
      .col-h { font-weight: 600; font-size: 22px; fill: #FFFFFF; }
      .caption { font-size: 13px; fill: #FFFFFF; }
      .x-mark { font-family: 'JetBrains Mono'; font-size: 18px; font-weight: 700; fill: #EF4444; }
      .q-mark { font-family: 'JetBrains Mono'; font-size: 16px; font-weight: 500; fill: #64748B; }
      .check  { stroke: #10B981; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }

      .red-circle  { opacity: 0; transform: scale(.6); transform-box: fill-box; transform-origin: center; animation: pop 0.5s cubic-bezier(.2,.9,.3,1.4) 0.2s forwards; }
      .x-pop { opacity: 0; transform: scale(.3); transform-box: fill-box; transform-origin: center; animation: pop 0.25s cubic-bezier(.2,.9,.3,1.6) forwards; }
      .q-flutter { opacity: 0; animation: qIn 0.6s ease forwards; }

      .green-circle { opacity: 0; transform: scale(.6); transform-box: fill-box; transform-origin: center; animation: pop 0.5s cubic-bezier(.2,.9,.3,1.4) 2.2s forwards; }
      .check-pop { opacity: 0; transform: scale(.3); transform-box: fill-box; transform-origin: center; animation: pop 0.3s cubic-bezier(.2,.9,.3,1.6) forwards; }
      .left-cap  { opacity: 0; animation: f 0.5s ease 2.0s forwards; }
      .right-cap { opacity: 0; animation: f 0.5s ease 3.4s forwards; }

      @keyframes pop { to { opacity: 1; transform: scale(1); } }
      @keyframes f   { to { opacity: 1; } }
      @keyframes qIn { 0% { opacity: 0; transform: translateY(-3px); } 60% { opacity: 0.7; } to { opacity: 0.7; transform: translateY(0); } }
    ]]></style>
  </defs>
  <text filter="url(#txtShadow)" class="title" x="512" y="56" text-anchor="middle">Blacklist vs Whitelist</text>

  <text filter="url(#txtShadow)" class="col-h" x="266" y="104" text-anchor="middle">Blacklist</text>
  <text filter="url(#txtShadow)" class="col-h" x="758" y="104" text-anchor="middle">Whitelist</text>

  <!-- Question marks scattered around blacklist (outside) -->
