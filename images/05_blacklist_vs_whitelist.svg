    <text filter="url(#txtShadow)" class="q-mark q-flutter" x="80"  y="160" style="animation-delay: .9s">?</text>
    <text filter="url(#txtShadow)" class="q-mark q-flutter" x="120" y="125" style="animation-delay: 1.0s">?</text>
