  <text filter="url(#txtShadow)" class="caption left-cap" x="266" y="488" text-anchor="middle">Block known bad → infinite unknown bad</text>

  <!-- Green whitelist -->
  <g class="green-circle">
    <circle cx="758" cy="296" r="148" fill="none" stroke="#10B981" stroke-width="2.2"/>
  </g>
  <!-- 3x3 checks centered on (758,296), spacing 50.
       NOTE: outer <g transform="translate(...)"> positions; inner <g class="check-pop"> animates.
       Two layers needed because CSS keyframe `transform: scale(1)` overrides any SVG transform attribute on the same element. -->
  <g>
    <g transform="translate(708,256)"><g class="check-pop" style="animation-delay:2.45s"><path class="check" d="M-9,0 L-2,8 L11,-8"/></g></g>
    <g transform="translate(758,256)"><g class="check-pop" style="animation-delay:2.55s"><path class="check" d="M-9,0 L-2,8 L11,-8"/></g></g>
    <g transform="translate(808,256)"><g class="check-pop" style="animation-delay:2.65s"><path class="check" d="M-9,0 L-2,8 L11,-8"/></g></g>
    <g transform="translate(708,306)"><g class="check-pop" style="animation-delay:2.75s"><path class="check" d="M-9,0 L-2,8 L11,-8"/></g></g>
    <g transform="translate(758,306)"><g class="check-pop" style="animation-delay:2.85s"><path class="check" d="M-9,0 L-2,8 L11,-8"/></g></g>
